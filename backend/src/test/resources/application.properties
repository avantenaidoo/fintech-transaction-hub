# This is test-specific database config
spring.datasource.url=jdbc:postgresql://localhost:5432/fintech_hub_test
spring.datasource.username=fintech_app
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Preserve existing test database
spring.flyway.enabled=false

# Python settlement reconciliation
reconciliation.python-command=python
reconciliation.project-root=.
reconciliation.settlement-file=reconciliation/data/sample_settlement.csv
reconciliation.timeout-seconds=15