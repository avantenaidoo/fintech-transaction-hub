spring.application.name=transaction-api

spring.datasource.url=jdbc:postgresql://localhost:5432/fintech_hub
spring.datasource.username=fintech_app
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Configure Flyway for existing databases
spring.flyway.baseline-on-migrate=true

# Python settlement reconciliation
reconciliation.python-command=python
reconciliation.project-root=..
reconciliation.settlement-file=reconciliation/data/sample_settlement.csv
reconciliation.timeout-seconds=15