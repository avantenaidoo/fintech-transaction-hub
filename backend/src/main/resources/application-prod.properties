# Production application configuration
spring.application.name=transaction-api

# PostgreSQL connection
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Database schema management
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Python settlement reconciliation
reconciliation.python-command=${PYTHON_COMMAND:python3}
reconciliation.project-root=${PROJECT_ROOT:/app}
reconciliation.settlement-file=${SETTLEMENT_FILE:reconciliation/data/sample_settlement.csv}
reconciliation.timeout-seconds=15